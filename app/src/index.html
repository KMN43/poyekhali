<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efece5">
<title>Poyekhali</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<main id="app">
  <section class="top">
    <header>
      <svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><use href="#logo"/></svg>
      <div class="ttl"><b>Poyekhali<small>Поехали</small></b><span class="meta" id="where" role="button" tabindex="0" aria-label="Cambiar ubicación">Zaragoza</span></div>
      <div class="seg" role="group" aria-label="Días">
        <button data-days="7" aria-pressed="true">7 d</button><button data-days="14" aria-pressed="false">14 d</button>
      </div>
    </header>
    <nav class="tabs" id="tabs" aria-label="Páginas">
      <button class="on" data-p="0"><b>01</b>Mapa</button><button data-p="1"><b>02</b>Ficha</button><button data-p="2"><b>03</b>Cielo</button>
      <span class="sp"></span><span class="prec">±1 s</span>
    </nav>
    <!-- desliza: mapa ↔ ficha del satélite ↔ cielo -->
    <div class="pager" id="pager">
      <div class="page"><canvas id="map" aria-label="Mapa del mundo con la trayectoria de la pasada elegida"></canvas></div>
      <div class="page card" id="card" aria-label="Ficha del satélite"></div>
      <div class="page sky" id="sky" aria-label="Cielo: recorrido de la pasada y perfil de elevación"></div>
    </div>
    <div id="detail" class="detail" aria-live="polite"></div>
    <div id="chips" class="chips" role="group" aria-label="Satélites"></div>
    <div id="upd" class="upd" hidden></div>
  </section>
  <section class="bottom" id="list" aria-label="Próximas pasadas"></section>
  <!-- banda inferior: información, actualizaciones y compartir -->
  <nav class="abar" aria-label="Acciones">
    <button id="bInfo"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M8 7.2v4M8 4.6v.1"/></svg>Info</button>
    <button id="bLoc"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 14.6s4.6-4.3 4.6-7.8a4.6 4.6 0 0 0-9.2 0c0 3.5 4.6 7.8 4.6 7.8Z"/><circle cx="8" cy="6.8" r="1.6"/></svg>Lugar</button>
    <button id="bUpd"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.4 8a5.4 5.4 0 1 1-1.6-3.8M12.2 1.8v2.6H9.6"/></svg>Actualizar</button>
    <button id="bShare"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="4" cy="8" r="1.8"/><circle cx="12" cy="3.6" r="1.8"/><circle cx="12" cy="12.4" r="1.8"/><path d="M5.6 7.1l4.8-2.6M5.6 8.9l4.8 2.6"/></svg>Compartir</button>
  </nav>
</main>
<div class="sheet" id="sheet" hidden><div class="sheetIn" id="sheetIn" role="dialog" aria-modal="true" aria-label="Información"></div></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="logo"></g>
  </defs>
</svg>

<script src="vendor/satellite.min.js"></script>
<script src="land.js"></script>
<script src="fallback.js"></script>
<script src="logo.js"></script>
<script src="sats.js"></script>
<script src="app.js"></script>
</body>
</html>
